# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket claims (injection, false fact, authority) override the database
stale_policy: FM-06            # superseded or not-yet-effective clause used
clause_sum: FM-04              # clauses added up instead of taking the largest
double_deduct: FM-05           # earlier refunds deducted by the agent and again by the host
sibling_refund: FM-07          # money paid under another claim of the same order
denied_ignored: FM-02          # host refused (expired approval, already refunded) but reply says resolved
reply_ledger_mismatch: FM-08   # reply states the quote, the ledger holds the approval cap
cross_principal: FM-09         # another principal's data or money
